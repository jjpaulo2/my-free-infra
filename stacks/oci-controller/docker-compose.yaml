services:

  oci:
    image: ghcr.io/oracle/oci-cli:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - oci_scripts:/usr/local/bin
    environment:
      VM_node_heavy_0: ${VM_node_heavy_0}
    entrypoint: sleep infinity
  
volumes:
  oci_scripts:
