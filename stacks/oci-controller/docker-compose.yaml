services:

  turn-on-cluster-node-heavy-0:
    image: ghcr.io/oracle/oci-cli:latest
    container_name: turn-on-cluster-node-heavy-0
    pull_policy: always
    restart: no
    entrypoint:
      - oci
      - compute
      - instance
      - action
      - --instance-id
      - ${MACHINE_OCID}
      - --action
      - START
      - --auth
      - instance_principal
  
  turn-off-cluster-node-heavy-0:
    image: ghcr.io/oracle/oci-cli:latest
    container_name: turn-off-cluster-node-heavy-0
    pull_policy: always
    restart: no
    entrypoint:
      - oci
      - compute
      - instance
      - action
      - --instance-id
      - ${MACHINE_OCID}
      - --action
      - SOFTSTOP
      - --auth
      - instance_principal
