services:

  portainer:
    image: portainer/agent:lts
    pull_policy: always
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  
volumes:
  portainer_data: